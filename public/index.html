<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Password Strength Analyzer</title>
    <style>
      body{font-family:system-ui,Segoe UI,Arial;margin:24px}
      input{font-size:16px;padding:8px;width:320px}
      button{padding:8px 12px;margin-left:8px}
      pre{background:#f6f8fa;padding:12px}
    </style>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Password Strength Analyzer</h1>
        <p class="subtitle">Professional password security insights — modern, fast, private.</p>
      </header>

      <main class="card-grid">
        <section class="card input-card">
          <label class="label">Password</label>
          <div class="input-row">
            <input id="pw" type="password" placeholder="Enter or generate a secure password" autocomplete="off" />
            <button id="toggleVis" class="btn secondary vis-toggle" aria-pressed="false" title="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 5c-7 0-11 6-11 7s4 7 11 7 11-6 11-7-4-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"></path><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
            </button>
            <div class="actions">
              <button id="copy" class="btn secondary">Copy</button>
              <button id="gen" class="btn primary">Generate Strong</button>
            </div>
          </div>
          <div class="controls">
            <button id="analyze" class="btn accent">Analyze</button>
          </div>
        </section>

        <section class="card result-card" aria-live="polite">
          <div class="result-header">
            <div>
              <h2 id="ratingBadge" class="rating-badge">No Data</h2>
              <div class="score">Score: <span id="scoreVal">—</span>/100</div>
            </div>
            <div class="meter-wrap">
              <div id="meter" class="meter">
                <div id="meterFill" class="meter-fill"></div>
              </div>
            </div>
          </div>

          <div class="stats">
            <div class="stat"><svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5z"></path></svg><div><strong id="len">-</strong><span>Length</span></div></div>
            <div class="stat"><svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5z"></path></svg><div><strong id="upper">-</strong><span>Uppercase</span></div></div>
            <div class="stat"><svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5z"></path></svg><div><strong id="lower">-</strong><span>Lowercase</span></div></div>
            <div class="stat"><svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5z"></path></svg><div><strong id="num">-</strong><span>Numbers</span></div></div>
            <div class="stat"><svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5z"></path></svg><div><strong id="spec">-</strong><span>Special</span></div></div>
          </div>

          <div class="meta">
            <div class="meta-item">Entropy: <strong id="entropy">—</strong> bits</div>
            <div class="meta-item">Estimated crack time: <strong id="crack">—</strong></div>
          </div>

          <div id="recs" class="recommendations"></div>
        </section>
      </main>
    </div>

    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js"></script>
    <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
